<html lang="id" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AL-AHIBBAH LIL ALFIYYAH</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&amp;family=Poppins:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    
    :root {
      --color-bg-primary: #0a0e14;
      --color-bg-secondary: #0f1419;
      --color-surface: #1a2332;
      --color-surface-light: #2d3e52;
      --color-accent-gold: #d4af37;
      --color-accent-light: #e8c547;
      --color-text-primary: #f5f5f5;
      --color-text-secondary: #b0b0b0;
      --color-green-dark: #0d3b2a;
      --color-green-medium: #1a5d47;
    }
    
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    
    body {
      background: linear-gradient(135deg, var(--color-bg-primary) 0%, #0d1820 50%, var(--color-bg-primary) 100%);
      color: var(--color-text-primary);
      font-family: 'Poppins', sans-serif;
      overflow: auto;
    }
    
    .font-amiri { font-family: 'Amiri', serif; }
    .font-poppins { font-family: 'Poppins', sans-serif; }
    
    /* Subtle Islamic pattern */
    .pattern-bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(circle at 20% 50%, rgba(26, 93, 71, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(212, 175, 55, 0.03) 0%, transparent 50%);
      pointer-events: none;
    }
    
    /* Header Section */
    header {
      position: relative;
      padding: 3rem 1.5rem;
      border-bottom: 1px solid rgba(212, 175, 55, 0.1);
    }
    
    header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--color-accent-gold), transparent);
    }
    
    .logo-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 1.5rem;
    }
    
    .logo-img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2px solid var(--color-accent-gold);
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
      object-fit: cover;
    }
    
    .logo-img:hover {
      box-shadow: 0 0 40px rgba(212, 175, 55, 0.3);
    }
    
    h1 {
      font-family: 'Amiri', serif;
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--color-accent-gold);
      text-align: center;
      margin: 0 0 0.5rem 0;
      text-shadow: 0 4px 20px rgba(212, 175, 55, 0.1);
    }
    
    .subtitle {
      font-size: 1rem;
      letter-spacing: 2px;
      color: var(--color-text-secondary);
      text-align: center;
      margin: 0;
      font-weight: 300;
    }
    
    .divider-line {
      width: 80px;
      height: 2px;
      margin: 1.5rem auto;
      background: linear-gradient(90deg, transparent, var(--color-accent-gold), transparent);
    }
    
    /* Main Content */
    main {
      flex: 1;
      padding: 2.5rem 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }
    
    /* Video Player Card */
    .player-card {
      background: linear-gradient(135deg, var(--color-surface) 0%, var(--color-green-dark) 100%);
      border: 1px solid rgba(212, 175, 55, 0.15);
      border-radius: 16px;
      padding: 2rem;
      margin-bottom: 3rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
    }
    
    .player-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    
    .live-indicator {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: var(--color-accent-gold);
      font-weight: 500;
    }
    
    .live-dot {
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .video-title {
      font-family: 'Amiri', serif;
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--color-accent-light);
    }
    
    .video-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 12px;
      background: #000;
      border: 1px solid rgba(212, 175, 55, 0.1);
    }
    
    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    
    /* Section Header */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    
    .section-header .divider-line {
      flex: 1;
      max-width: 60px;
      margin: 0;
    }
    
    .section-title {
      font-family: 'Amiri', serif;
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--color-accent-gold);
      letter-spacing: 1px;
    }
    
    /* Video Grid */
    #video-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }
    
    @media (max-width: 640px) {
      #video-list {
        grid-template-columns: repeat(2, 1fr);
        gap: 1rem;
      }
    }
    
    .video-card {
      background: var(--color-surface);
      border: 1px solid rgba(212, 175, 55, 0.1);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }
    
    .video-card:hover {
      border-color: var(--color-accent-gold);
      transform: translateY(-6px);
      box-shadow: 0 15px 40px rgba(212, 175, 55, 0.2);
    }
    
    .video-card.active {
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.1) 0%, rgba(26, 93, 71, 0.3) 100%);
      border-color: var(--color-accent-gold);
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.25);
    }
    
    .video-thumbnail {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      display: block;
      background: var(--color-green-dark);
    }
    
    .video-card-title {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--color-accent-gold);
      padding: 1rem;
      text-align: center;
      line-height: 1.3;
      font-family: 'Amiri', serif;
    }
    
    .play-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 45px;
      height: 45px;
      background: rgba(212, 175, 55, 0.9);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: all 0.3s ease;
    }
    
    .video-card:hover .play-icon {
      opacity: 1;
    }
    
    .play-icon svg {
      width: 20px;
      height: 20px;
      fill: #000;
      margin-left: 2px;
    }
    
    /* Gallery Grid */
    #photo-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1.5rem;
      grid-auto-rows: auto;
    }
    
    @media (max-width: 640px) {
      #photo-gallery {
        grid-template-columns: repeat(2, 1fr);
        gap: 1rem;
      }
    }
    
    .photo-card {
      background: var(--color-surface);
      border: 1px solid rgba(212, 175, 55, 0.1);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 150px;
    }
    
    .photo-card:hover {
      border-color: var(--color-accent-gold);
      transform: translateY(-6px);
      box-shadow: 0 15px 40px rgba(212, 175, 55, 0.2);
    }
    
    .photo-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--color-green-dark);
      padding: 0.75rem;
    }
    
    .photo-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    
    .photo-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    
    .photo-card:hover .photo-overlay {
      opacity: 1;
    }
    
    .photo-overlay svg {
      width: 40px;
      height: 40px;
      fill: var(--color-accent-gold);
    }
    
    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.95);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    
    .modal.active {
      display: flex;
    }
    
    .modal-content {
      position: relative;
      max-width: 95%;
      max-height: 95%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .modal-image {
      max-width: 100%;
      max-height: 90vh;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }
    
    .modal-close {
      position: absolute;
      top: -40px;
      right: 0;
      background: none;
      border: none;
      color: var(--color-accent-gold);
      font-size: 2rem;
      cursor: pointer;
      transition: color 0.3s ease;
      z-index: 10;
    }
    
    .modal-close:hover {
      color: var(--color-accent-light);
    }
    
    .modal-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(212, 175, 55, 0.2);
      border: none;
      color: var(--color-accent-gold);
      padding: 1rem;
      cursor: pointer;
      font-size: 1.5rem;
      transition: all 0.3s ease;
      border-radius: 8px;
    }
    
    .modal-nav:hover {
      background: rgba(212, 175, 55, 0.4);
    }
    
    .modal-prev {
      left: 1rem;
    }
    
    .modal-next {
      right: 1rem;
    }
    
    @media (max-width: 768px) {
      .modal-close {
        top: -30px;
        font-size: 1.5rem;
      }
      
      .modal-nav {
        padding: 0.75rem;
        font-size: 1.2rem;
      }
    }
    
    /* Footer */
    footer {
      position: relative;
      padding: 2.5rem 1.5rem;
      border-top: 1px solid rgba(212, 175, 55, 0.1);
      margin-top: auto;
      text-align: center;
    }
    
    footer::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--color-accent-gold), transparent);
    }
    
    .footer-text {
      margin: 0.5rem 0;
    }
    
    .footer-copyright {
      font-size: 1rem;
      font-weight: 500;
      color: var(--color-text-primary);
      font-family: 'Poppins', sans-serif;
    }
    
    .footer-developer {
      font-size: 0.9rem;
      color: var(--color-text-secondary);
      letter-spacing: 0.5px;
    }
    
    .whatsapp-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, #25d366, #1fa855);
      border-radius: 50%;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
      margin-top: 1.5rem;
    }
    
    .whatsapp-link:hover {
      box-shadow: 0 6px 25px rgba(37, 211, 102, 0.5);
      transform: scale(1.1);
    }
    
    .whatsapp-link svg {
      width: 28px;
      height: 28px;
      fill: white;
    }
    
    /* Animations */
    @keyframes slideInDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes slideInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .animate-in {
      animation: slideInDown 0.6s ease-out;
    }
    
    .animate-in-delayed {
      animation: slideInUp 0.6s ease-out forwards;
      opacity: 0;
    }
    
    @media (max-width: 768px) {
      h1 {
        font-size: 1.8rem;
      }
      
      .player-card {
        padding: 1.5rem;
      }
      
      .video-title {
        font-size: 1.2rem;
      }
      
      header {
        padding: 2rem 1rem;
      }
      
      main {
        padding: 1.5rem 1rem;
      }
      
      footer {
        padding: 1.5rem 1rem;
      }
    }
    
    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    
    ::-webkit-scrollbar-track {
      background: rgba(26, 93, 71, 0.1);
    }
    
    ::-webkit-scrollbar-thumb {
      background: rgba(212, 175, 55, 0.3);
      border-radius: 4px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(212, 175, 55, 0.5);
    }
  </style>

  <script>
    const defaultConfig = {
      site_title: "AL-AHIBBAH LIL ALFIYYAH",
      hero_subtitle: "Koleksi Nadzom Alfiyyah Ibnu Malik",
      gallery_title: "Galeri Foto",
      footer_copyright: "© 2026 SANTRI ALAWI",
      footer_developer: "Developer and Design by Ainun Na'im",
      background_color: "#0a0e14",

      primary_action_color: "#d4af37",
      secondary_action_color: "#1a5d47",
      font_family: "Amiri",
      font_size: 16
    };

    const videoData = [
      { id: 1, title: "NADZOM 1-126", url: "https://drive.google.com/file/d/1V9uAb65gDBVDHwHexb-fKyhuPNJd7hFD/preview" },
      { id: 2, title: "NADZOM 126-225", url: "https://drive.google.com/file/d/1d5BGpFN4uKIPe2zwkSQaWw64sP2MBpRu/preview" },
      { id: 3, title: "NADZOM 226-351", url: "https://drive.google.com/file/d/1Ma2ChaLFncJUNInmS0ny1SkFmPf_EZzy/preview" },

      { id: 5, title: "NADZOM 451-576", url: "https://drive.google.com/file/d/17DPDfi_WXhc17eYjH1_zXS-RzDM3O73W/preview" },
      { id: 6, title: "NADZOM 576-675", url: "https://drive.google.com/file/d/1xGuzHF3nFOLGTtNyTq1MpUqCQKHpLon2/preview" },
      { id: 7, title: "NADZOM 676-801", url: "https://drive.google.com/file/d/1pYRJ8r5_XYaZJHx2axMwTSpuMn8u_0IF/preview" },

      { id: 9, title: "NADZOM 901-990", url: "https://drive.google.com/file/d/1lLPE3FWP641Sm1EL-meffAWxfGGQNWtQ/preview" },
      { id: 10, title: "NADZOM 991-1002", url: "https://drive.google.com/file/d/11Y4Me749ftpCOhNURacIwTUIVtOBTPSn/preview" }
    ];

    const photoData = [
      { id: 1, url: "https://raw.githubusercontent.com/daarunnajahkumpulrejo/alfiyah/main/images/foto1.JPG" },
      { id: 2, url: "https://raw.githubusercontent.com/daarunnajahkumpulrejo/alfiyah/main/images/foto2.JPG" },
      { id: 3, url: "https://raw.githubusercontent.com/daarunnajahkumpulrejo/alfiyah/main/images/foto3.JPG" }
    ];


    let currentVideoId = 1;
    let currentPhotoIndex = 0;

    function renderVideoList() {
      const container = document.getElementById('video-list');
      container.innerHTML = '';
      
      videoData.forEach((video, index) => {
        const card = document.createElement('div');
        card.className = `video-card ${video.id === currentVideoId ? 'active' : ''}`;
        card.dataset.videoId = video.id;
        card.style.animationDelay = `${0.3 + index * 0.05}s`;
        card.classList.add('animate-in-delayed');
        
        card.innerHTML = `
          <div style="position: relative; background: var(--color-green-dark);">
            <img 
              src="https://i.imgur.com/LbYCkqU.png" 
              alt="${video.title}"
              class="video-thumbnail"
              loading="lazy"
              onerror="console.error('Thumbnail failed to load:', this.src); this.style.background='linear-gradient(135deg, #0d3b2a, #1a2332)'; this.alt='Poster';"
            >
            <div class="play-icon">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M8 5v14l11-7z"/>
              </svg>
            </div>
          </div>
          <div class="video-card-title">${video.title}</div>
        `;
        
        card.addEventListener('click', () => playVideo(video.id));
        container.appendChild(card);
      });
    }

    function renderPhotoGallery() {
      const container = document.getElementById('photo-gallery');
      container.innerHTML = '';
      
      photoData.forEach((photo, index) => {
        const card = document.createElement('div');
        card.className = 'photo-card';
        card.style.animationDelay = `${0.4 + index * 0.05}s`;
        card.classList.add('animate-in-delayed');
        
        card.innerHTML = `
          <div class="photo-wrapper">
            <img 
              src="${photo.url}" 
              alt="Foto ${index + 1}"
              class="photo-image"
              loading="lazy"
              onerror="console.error('Photo failed to load:', this.src); this.style.background='linear-gradient(135deg, #0d3b2a, #1a2332)'; this.alt='Foto';"
            >
          </div>
          <div class="photo-overlay">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M3 9h18v10c0 1.1-.9 2-2 2H5c-1.1 0-2-.9-2-2V9z"/>
              <path d="M3 6h18V4c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v2z"/>
              <circle cx="12" cy="15" r="3.5"/>
            </svg>
          </div>
        `;
        
        card.addEventListener('click', () => openPhotoModal(index));
        container.appendChild(card);
      });
    }

    function playVideo(videoId) {
      const video = videoData.find(v => v.id === videoId);
      if (!video) return;
      
      currentVideoId = videoId;
      
      const player = document.getElementById('video-player');
      player.src = video.url;
      
      document.getElementById('current-video-title').textContent = video.title;
      
      document.querySelectorAll('.video-card').forEach(card => {
        const cardId = parseInt(card.dataset.videoId);
        if (cardId === videoId) {
          card.classList.add('active');
        } else {
          card.classList.remove('active');
        }
      });
      
      document.querySelector('.player-card').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function openPhotoModal(index) {
      currentPhotoIndex = index;
      const modal = document.getElementById('photo-modal');
      const modalImage = document.getElementById('modal-image');
      modalImage.src = photoData[index].url;
      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closePhotoModal() {
      const modal = document.getElementById('photo-modal');
      modal.classList.remove('active');
      document.body.style.overflow = 'auto';
    }

    function nextPhoto() {
      currentPhotoIndex = (currentPhotoIndex + 1) % photoData.length;
      document.getElementById('modal-image').src = photoData[currentPhotoIndex].url;
    }

    function prevPhoto() {
      currentPhotoIndex = (currentPhotoIndex - 1 + photoData.length) % photoData.length;
      document.getElementById('modal-image').src = photoData[currentPhotoIndex].url;
    }

    async function onConfigChange(config) {
      const fontFamily = config.font_family || defaultConfig.font_family;
      const fontSize = config.font_size || defaultConfig.font_size;
      
      document.getElementById('site-title').textContent = config.site_title || defaultConfig.site_title;
      document.getElementById('hero-subtitle').textContent = config.hero_subtitle || defaultConfig.hero_subtitle;
      document.getElementById('gallery-title').textContent = config.gallery_title || defaultConfig.gallery_title;
      document.getElementById('footer-copyright').textContent = config.footer_copyright || defaultConfig.footer_copyright;
      document.getElementById('footer-developer').textContent = config.footer_developer || defaultConfig.footer_developer;
      
      document.getElementById('site-title').style.fontFamily = fontFamily === 'Amiri' ? "'Amiri', serif" : `${fontFamily}, serif`;
      document.getElementById('site-title').style.fontSize = `${fontSize * 2}px`;
    }

    function mapToCapabilities(config) {
      return {
        recolorables: [
          {
            get: () => config.background_color || defaultConfig.background_color,
            set: (value) => {
              config.background_color = value;
              if (window.elementSdk) window.elementSdk.setConfig({ background_color: value });
            }
          },
          {
            get: () => config.surface_color || defaultConfig.surface_color,
            set: (value) => {
              config.surface_color = value;
              if (window.elementSdk) window.elementSdk.setConfig({ surface_color: value });
            }
          },
          {
            get: () => config.text_color || defaultConfig.text_color,
            set: (value) => {
              config.text_color = value;
              if (window.elementSdk) window.elementSdk.setConfig({ text_color: value });
            }
          },
          {
            get: () => config.primary_action_color || defaultConfig.primary_action_color,
            set: (value) => {
              config.primary_action_color = value;
              if (window.elementSdk) window.elementSdk.setConfig({ primary_action_color: value });
            }
          },
          {
            get: () => config.secondary_action_color || defaultConfig.secondary_action_color,
            set: (value) => {
              config.secondary_action_color = value;
              if (window.elementSdk) window.elementSdk.setConfig({ secondary_action_color: value });
            }
          }
        ],
        borderables: [],
        fontEditable: {
          get: () => config.font_family || defaultConfig.font_family,
          set: (value) => {
            config.font_family = value;
            if (window.elementSdk) window.elementSdk.setConfig({ font_family: value });
          }
        },
        fontSizeable: {
          get: () => config.font_size || defaultConfig.font_size,
          set: (value) => {
            config.font_size = value;
            if (window.elementSdk) window.elementSdk.setConfig({ font_size: value });
          }
        }
      };
    }

    function mapToEditPanelValues(config) {
      return new Map([
        ["site_title", config.site_title || defaultConfig.site_title],
        ["hero_subtitle", config.hero_subtitle || defaultConfig.hero_subtitle],
        ["gallery_title", config.gallery_title || defaultConfig.gallery_title],
        ["footer_copyright", config.footer_copyright || defaultConfig.footer_copyright],
        ["footer_developer", config.footer_developer || defaultConfig.footer_developer]
      ]);
    }

    // Close modal on Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closePhotoModal();
      if (e.key === 'ArrowRight') nextPhoto();
      if (e.key === 'ArrowLeft') prevPhoto();
    });

    // Initialize
    renderVideoList();
    renderPhotoGallery();
    
    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities,
        mapToEditPanelValues
      });
    }
  </script>
